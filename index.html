<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snoop AI</title>
<style>
:root{--bg:#f3f1fb;--card:#fff;--ink:#17142b;--mute:#6b6785;--line:#e0dcf0;--acc:#7c3aed;--acc2:#10b981;--meink:#fff;--glow:rgba(124,58,237,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b1a;--card:#17142b;--ink:#f1eeff;--mute:#9b96b8;--line:#2a2548;--acc:#8b5cf6;--acc2:#34d399;--glow:rgba(139,92,246,.28);color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(900px 520px at 12% -8%,var(--glow),transparent 60%),radial-gradient(700px 500px at 112% 108%,rgba(16,185,129,.16),transparent 60%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto}
.hide{display:none!important}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:24px;box-shadow:0 6px 24px var(--glow)}
/* login */
#login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#login .logo{width:92px;height:92px;font-size:50px;border-radius:28px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#login h1{margin:6px 0 0;font-size:42px;letter-spacing:-1px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#login p{margin:0;color:var(--mute);max-width:320px;line-height:1.5}
#name{width:100%;max-width:260px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;text-align:center;outline:none}
#name:focus{border-color:var(--acc)}
.btn{border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--acc),#a855f7);color:#fff;box-shadow:0 8px 24px var(--glow)}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.badge{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mute);background:var(--card)}
/* chat */
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header .logo{width:38px;height:38px;font-size:20px;border-radius:12px}
header b{font-size:17px}header small{display:block;color:var(--acc2);font-size:12px}
header .sp{flex:1}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;padding:10px}
.empty h2{margin:10px 0 4px;font-size:24px}.empty p{margin:0 0 16px;color:var(--mute)}
.chips{display:grid;gap:8px}
.chip{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14.5px;cursor:pointer}
.chip:active{border-color:var(--acc)}
.m{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--acc),#a855f7);color:var(--meink);border-bottom-right-radius:6px}
.m.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-bottom-left-radius:6px;box-shadow:0 4px 18px var(--glow)}
.m.bot.err{border-left-color:#ef4444}
.m img{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-bottom:8px}
.m code{background:rgba(124,58,237,.15);padding:1px 5px;border-radius:6px;font-size:.92em}
.hd{display:block;font-size:1.08em;margin-top:4px}
.cb{margin:10px 0;border-radius:12px;overflow:hidden;border:1px solid #2f2a55;background:#0b0918;white-space:normal}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:#1a1636;color:#a9a3c9;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.ca{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cp{border:1px solid #3a3466;background:#241f47;color:#e9e5ff;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer}
.cp.play{background:var(--acc2);color:#04130d;border-color:transparent;font-weight:700}
.cp.ok{background:var(--acc2);color:#04130d;border-color:transparent}
.m pre{white-space:pre;overflow-x:auto;margin:0;padding:12px;color:#e9e5ff;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.m pre code{background:none;padding:0}
.retry{margin-top:10px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--acc);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
#bar{padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--card)}
#prev{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#prev img{height:54px;border-radius:10px}
#row{display:flex;align-items:flex-end;gap:8px}
#row textarea{flex:1;resize:none;max-height:140px;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit;outline:none}
#row textarea:focus{border-color:var(--acc)}
.ib{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
.ib.go{background:linear-gradient(135deg,var(--acc),#a855f7);border:0;color:#fff}
.ib.stop{background:#ef4444;border:0;color:#fff}
.ib:disabled{opacity:.5}
.note{text-align:center;color:var(--mute);font-size:11.5px;margin-top:8px}
/* jogar */
#play{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#play .pt{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1a1636;color:#e9e5ff}
#play .pt b{flex:1;font-size:15px}
#play iframe{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body>
<div id="app">
  <section id="login">
    <div class="logo">🎮</div>
    <h1>Snoop AI</h1>
    <p>A IA feita para jogos: dicas, estratégias, builds, códigos prontos e jogos em HTML que você joga na hora.</p>
    <input id="name" type="text" placeholder="Seu nome (opcional)" maxlength="24" autocomplete="given-name">
    <button class="btn" id="enter">Entrar</button>
    <div class="badges"><span class="badge">100% grátis</span><span class="badge">Cria jogos HTML</span><span class="badge">Envia fotos</span><span class="badge">Códigos com copiar</span></div>
  </section>

  <section id="chat" class="hide" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <header>
      <div class="logo">🎮</div>
      <div><b>Snoop AI</b><small id="hello">online</small></div>
      <div class="sp"></div>
      <button class="ghost" id="clear">Nova conversa</button>
    </header>
    <div id="msgs"></div>
    <div id="bar">
      <div id="prev" class="hide"><img id="pimg" alt=""><button class="ghost" id="rm">Remover</button></div>
      <div id="row">
        <input type="file" id="file" accept="image/*" class="hide">
        <button class="ib" id="photo" title="Enviar foto" aria-label="Enviar foto">📷</button>
        <textarea id="inp" rows="1" placeholder="Pergunte algo ou peça um jogo em HTML…"></textarea>
        <button class="ib go" id="send" aria-label="Enviar">➤</button>
      </div>
      <div class="note">A Snoop AI pode errar. Confira informações importantes.</div>
    </div>
  </section>
</div>

<div id="play" class="hide">
  <div class="pt"><b>Jogo</b><button class="cp" id="preload">Reiniciar</button><button class="cp" id="pclose">Fechar</button></div>
  <iframe id="pframe" sandbox="allow-scripts allow-modals allow-pointer-lock" title="Jogo"></iframe>
</div>

<script>
const $ = s => document.querySelector(s);
const API = "/.netlify/functions/chat";
const CHIPS = [
  "Crie um jogo da cobrinha em HTML bem bonito",
  "Qual a melhor build para começar em Elden Ring?",
  "Como faço um sistema de venda no Roblox?",
  "Dicas para subir de rank no Valorant"
];
let hist = [], imgData = null, imgPayload = null, busy = false, ctrl = null, lastCode = "";

/* ---------- armazenamento (protegido) ---------- */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
function saveHist(){ store.set("snoop_hist", JSON.stringify(hist.map(h => ({ role: h.role, content: h.content })).slice(-40))); }

/* ---------- texto -> HTML ---------- */
function esc(t){ return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function codeBlock(b){
  const lang = (b.l || "").toLowerCase();
  const raw = b.c.replace(/\n$/, "");
  const isHtml = lang === "html" || /^\s*<!doctype html|^\s*<html/i.test(raw);
  const btns = '<button class="cp" data-a="copy">Copiar</button>' +
    (isHtml ? '<button class="cp play" data-a="play">▶ Jogar</button><button class="cp" data-a="dl">Baixar</button>' : "");
  return '<div class="cb"><div class="ch"><span>' + esc(b.l || "código") + '</span><span class="ca">' + btns + '</span></div><pre><code>' + esc(raw) + "</code></pre></div>";
}
function md(t){
  const blocks = [];
  t = t.replace(/```([\w-]*)[^\n]*\n?([\s\S]*?)(```|$)/g, (m, l, c) => { blocks.push({ l, c }); return "\u0000" + (blocks.length - 1) + "\u0000"; });
  let h = esc(t);
  h = h.replace(/^#{1,4}\s+(.+)$/gm, '<b class="hd">$1</b>');
  h = h.replace(/^\s*[-*]\s+/gm, "• ");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
       .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "$1<i>$2</i>");
  h = h.replace(/\u0000(\d+)\u0000/g, (m, i) => codeBlock(blocks[+i]));
  return h;
}
function add(role, html){
  const d = document.createElement("div");
  d.className = "m " + role; d.innerHTML = html;
  $("#msgs").appendChild(d); scrollDown(); return d;
}
function scrollDown(){ const m = $("#msgs"); m.scrollTop = m.scrollHeight; }

function empty(){
  const m = $("#msgs"); m.innerHTML = "";
  const e = document.createElement("div"); e.className = "empty";
  e.innerHTML = '<div class="logo" style="margin:0 auto">🎮</div><h2>Qual é o jogo de hoje?</h2><p>Pergunte, envie uma screenshot ou peça um jogo em HTML.</p><div class="chips"></div>';
  CHIPS.forEach(c => { const b = document.createElement("button"); b.className = "chip"; b.textContent = c; b.onclick = () => { $("#inp").value = c; send(); }; e.querySelector(".chips").appendChild(b); });
  m.appendChild(e);
}
function renderHist(){
  const m = $("#msgs"); m.innerHTML = "";
  hist.forEach(h => add(h.role === "user" ? "me" : "bot", h.role === "user" ? esc(h.content) : md(h.content)));
}

/* ---------- entrar ---------- */
function enter(){
  const name = ($("#name").value || store.get("snoop_name") || "").trim().split(" ")[0] || "Jogador";
  store.set("snoop_name", name === "Jogador" ? "" : name);
  $("#login").classList.add("hide");
  $("#chat").classList.remove("hide");
  $("#hello").textContent = "Olá, " + name + " · online";
  try { hist = JSON.parse(store.get("snoop_hist") || "[]"); } catch (e) { hist = []; }
  if (hist.length) renderHist(); else empty();
}
$("#name").value = store.get("snoop_name") || "";
$("#enter").onclick = enter;
$("#name").onkeydown = e => { if (e.key === "Enter") enter(); };

$("#clear").onclick = () => { if (ctrl) ctrl.abort(); hist = []; store.del("snoop_hist"); clearImg(); setBusy(false); empty(); };

/* ---------- botões dos códigos ---------- */
$("#msgs").addEventListener("click", async e => {
  const retry = e.target.closest(".retry");
  if (retry) { retry.closest(".m").remove(); if (hist.length && hist[hist.length - 1].role === "user") ask(); return; }
  const b = e.target.closest(".cp"); if (!b) return;
  const code = b.closest(".cb").querySelector("code").textContent;
  const a = b.dataset.a;
  if (a === "play") { openPlay(code); return; }
  if (a === "dl") {
    const url = URL.createObjectURL(new Blob([code], { type: "text/html" }));
    const l = document.createElement("a"); l.href = url; l.download = "jogo.html"; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); return;
  }
  try { await navigator.clipboard.writeText(code); } catch (x) { const t = document.createElement("textarea"); t.value = code; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (y) {} t.remove(); }
  b.textContent = "Copiado ✓"; b.classList.add("ok");
  setTimeout(() => { b.textContent = "Copiar"; b.classList.remove("ok"); }, 1600);
});
function openPlay(code){ lastCode = code; $("#pframe").srcdoc = code; $("#play").classList.remove("hide"); }
$("#preload").onclick = () => { $("#pframe").srcdoc = ""; setTimeout(() => { $("#pframe").srcdoc = lastCode; }, 30); };
$("#pclose").onclick = () => { $("#play").classList.add("hide"); $("#pframe").srcdoc = ""; };

/* ---------- foto (reduz antes de enviar) ---------- */
$("#photo").onclick = () => $("#file").click();
$("#rm").onclick = clearImg;
function clearImg(){ imgData = null; imgPayload = null; $("#file").value = ""; $("#prev").classList.add("hide"); }
$("#file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      imgData = c.toDataURL("image/jpeg", 0.85);
      imgPayload = { mime: "image/jpeg", data: imgData.split(",")[1] };
      $("#pimg").src = imgData; $("#prev").classList.remove("hide");
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
};

/* ---------- entrada ---------- */
const inp = $("#inp");
inp.oninput = () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 140) + "px"; };
inp.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); send(); } };
$("#send").onclick = () => { if (busy) { if (ctrl) ctrl.abort(); } else send(); };
function setBusy(v){ busy = v; const s = $("#send"); s.textContent = v ? "■" : "➤"; s.classList.toggle("stop", v); s.setAttribute("aria-label", v ? "Parar" : "Enviar"); }

function send(){
  const text = inp.value.trim();
  if ((!text && !imgPayload) || busy) return;
  const em = $("#msgs .empty"); if (em) $("#msgs").innerHTML = "";
  add("me", (imgData ? '<img src="' + imgData + '" alt="">' : "") + esc(text));
  const q = text || "Analise esta imagem do jogo e me ajude.";
  hist.push({ role: "user", content: q, image: imgPayload });
  inp.value = ""; inp.style.height = "auto"; clearImg();
  ask();
}

function friendly(status, msg){
  if (status === 429) return "O limite grátis do Google foi atingido por agora. Espere cerca de 1 minuto e toque em Tentar de novo.";
  if (status === 500 && msg) return msg;
  if (status === 404 || status === 0) return "Não consegui falar com o servidor. Abra o site pelo link do Netlify (não pelo arquivo no celular) e confira se a função foi publicada.";
  if (status === 502 || status === 503) return "O Google não respondeu." + (msg ? " Detalhe: " + msg : " Toque em Tentar de novo.");
  return "Não consegui responder agora." + (msg ? " (" + msg + ")" : "");
}

async function ask(){
  setBusy(true);
  const bot = add("bot", '<span class="dots"><span></span><span></span><span></span></span>');
  ctrl = new AbortController();
  // só a imagem mais recente vai junto, para o envio ficar leve
  let lastImg = -1; hist.forEach((h, i) => { if (h.image) lastImg = i; });
  const payload = hist.map((h, i) => ({ role: h.role, content: h.content, image: i === lastImg ? h.image : null }));
  let full = "";
  try {
    let res;
    try { res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: payload }), signal: ctrl.signal }); }
    catch (e) { if (e.name === "AbortError") throw e; throw { status: 0 }; }
    if (!res.ok) { let j = {}; try { j = await res.json(); } catch (e) {} throw { status: res.status, msg: j.error }; }
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const d = line.slice(5).trim(); if (!d || d === "[DONE]") continue;
        try {
          const parts = (JSON.parse(d).candidates || [{}])[0].content?.parts || [];
          for (const p of parts) if (p.text && !p.thought) full += p.text;
          if (full) { bot.innerHTML = md(full); scrollDown(); }
        } catch (e) {}
      }
    }
    if (!full.trim()) throw { status: -1, msg: "a resposta veio vazia ou foi bloqueada, tente reformular o pedido" };
    hist.push({ role: "assistant", content: full }); saveHist();
  } catch (err) {
    if (err && err.name === "AbortError") {
      if (!hist.length) bot.remove();
      else if (full.trim()) { hist.push({ role: "assistant", content: full }); saveHist(); }
      else bot.remove();
    } else {
      bot.classList.add("err");
      bot.innerHTML = esc(friendly(err.status, err.msg)) + '<br><button class="ghost retry">Tentar de novo</button>';
    }
  }
  setBusy(false); scrollDown();
}
</script>
</body>
</html>
